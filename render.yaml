services:
  - type: web
    name: runa-budget-app
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: GOOGLE_FORM_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NUMERAI_PUBLIC_ID
        sync: false
      - key: NUMERAI_SECRET_KEY
        sync: false
      - key: RUNA_API_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
